name: Publish images
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release to build (original or workspace-v5)
        default: original
        type: choice
        options: [original, workspace-v5]
permissions:
  contents: read
  packages: write
jobs:
  matrix:
    if: inputs.release != 'workspace-v5'
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
      - id: tasks
        run: |
          python - <<'PY'
          import json, os
          rows = [json.loads(line) for line in open('tasks.jsonl')]
          matrix = {'include': [{'task_id': r['task_id'], 'source_image': r['source_image'], 'dataset_type': r['dataset_type']} for r in rows]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tasks=' + json.dumps(matrix) + '\n')
          PY
  publish:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test client
        run: pip install 'openenv @ git+https://github.com/meta-pytorch/OpenEnv.git@86a180ede21e044f7929b9a7783ad83aa67d83a3' requests websockets
      - name: Build pinned task image
        env:
          TASK_ID: ${{ matrix.task_id }}
          TASK_IMAGE: ${{ matrix.source_image }}
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: openenv build -t "ghcr.io/akseljoonas/mimo-openenv-software:${TASK_ID}-v3c" --build-arg "TASK_ID=$TASK_ID" --build-arg "TASK_IMAGE=$TASK_IMAGE"
      - name: Replay real episodes
        env:
          TASK_ID: ${{ matrix.task_id }}
          DATASET_TYPE: ${{ matrix.dataset_type }}
        run: |
          python verify.py "ghcr.io/akseljoonas/mimo-openenv-software:${TASK_ID}-v3c" "$TASK_ID" --dataset-type "$DATASET_TYPE" --solution "solutions/${TASK_ID}.py" --output "evidence/${TASK_ID}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.task_id }}
          path: evidence/${{ matrix.task_id }}.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          TASK_ID: ${{ matrix.task_id }}
        run: docker push "ghcr.io/akseljoonas/mimo-openenv-software:${TASK_ID}-v3c"
  workspace-v5:
    if: inputs.release == 'workspace-v5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation client
        run: pip install 'openenv @ git+https://github.com/meta-pytorch/OpenEnv.git@86a180ede21e044f7929b9a7783ad83aa67d83a3' requests websockets
      - name: Build fixed workflow image
        run: docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -t ghcr.io/akseljoonas/mimo-openenv-software:workspace-v5-${{ github.sha }} releases/workspace-v5
      - name: Verify actual OpenEnv episodes
        run: python releases/workspace-v5/verify_workflows.py ghcr.io/akseljoonas/mimo-openenv-software:workspace-v5-${{ github.sha }} --output evidence/workspace-v5.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-v5-validation
          path: evidence/workspace-v5.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified workflow image
        run: docker push ghcr.io/akseljoonas/mimo-openenv-software:workspace-v5-${{ github.sha }}
